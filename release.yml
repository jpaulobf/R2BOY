name: Build and Release

on:
  push:
    tags:
      - 'v*' # Dispara quando você cria uma tag como v0.5.0
  workflow_dispatch: # Permite rodar manualmente pela aba Actions

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MinGW (Manual via Chocolatey)
        shell: pwsh
        run: |
          choco install mingw --version 15.2.0 -y
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure CMake
        # Seleciona o compilador MinGW para o build Windows.
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

      - name: Build Project
        run: |
          cmake --build build --config Release

      - name: Prepare Artifacts
        # Empacota o executável e a licença.
        run: |
          mkdir release_pkg
          cp bin/R2BOY.exe release_pkg/
          cp LICENSE release_pkg/
          
      - name: Create Zip
        shell: pwsh
        run: |
          Compress-Archive -Path release_pkg/* -DestinationPath R2BOY_Windows_x64.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: R2BOY_Windows_x64.zip
          body: |
            Build automática gerada pelo GitHub Actions.
            
            **Mudanças nesta versão:**
            ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

